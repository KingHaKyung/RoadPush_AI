[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadpush-ai"
version = "0.1.0"
description = "Sequential RoadPush surface and obstacle analysis"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "numpy==2.5.2",
  "opencv-python==5.0.0.93",
  "Pillow==12.3.0",
  "PyYAML==6.0.3",
  "psutil==7.2.2",
  "requests==2.34.2",
  "scipy==1.18.1",
  "transformers==4.57.6",
  "ultralytics==8.4.176",
]

[project.scripts]
roadpush-analyze = "roadpush_ai.cli:main"
roadpush-verify-models = "roadpush_ai.assets:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
